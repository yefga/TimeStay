# Country to Timezone Mappings
# ============================
# This YAML file maps country names to their primary timezones.
# 
# Note: Some countries span multiple timezones (e.g., USA, Russia).
# For simplicity, we use the most common/capital city timezone.
# This is a learning project - production apps would use more comprehensive data.

